name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-verify-build:
    name: android-verify-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable development signing key
        env:
          NOOR_DEBUG_KEYSTORE_BASE64: ${{ secrets.NOOR_DEBUG_KEYSTORE_BASE64 }}
          NOOR_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.NOOR_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$NOOR_DEBUG_KEYSTORE_BASE64" && -z "$NOOR_DEBUG_KEYSTORE_PASSWORD" ]]; then
            echo "Signing secrets are unavailable; using the default debug signing key."
            exit 0
          fi
          if [[ -z "$NOOR_DEBUG_KEYSTORE_BASE64" || -z "$NOOR_DEBUG_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both development signing secrets must be configured."
            exit 1
          fi
          keystore_file="$RUNNER_TEMP/noor-development.keystore"
          umask 077
          printf '%s' "$NOOR_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          test -s "$keystore_file"
          echo "NOOR_DEBUG_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"

      - name: Validate offline content packs
        run: python3 scripts/validate_content_packs.py

      - name: Run unit tests and assemble debug APK
        env:
          NOOR_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.NOOR_DEBUG_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          script: ./gradlew --no-daemon connectedDebugAndroidTest
        env:
          NOOR_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.NOOR_DEBUG_KEYSTORE_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
